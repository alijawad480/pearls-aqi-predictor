name: Training Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # once a day at 3 AM UTC, after enough new hourly data has come in

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the training pipeline
        run: |
          cd src
          python training_pipeline.py

      - name: Commit updated models back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --quiet --cached || git commit -m "Retrain models $(date -u +'%Y-%m-%d')"
          git pull --no-rebase -X ours
          git push